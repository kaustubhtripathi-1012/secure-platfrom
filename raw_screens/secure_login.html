<!DOCTYPE html>

<title>CipherVault - Secure Login</title>

<style>
        .grid-pattern {
            background-size: 40px 40px;
            background-image: 
                linear-gradient(to right, rgba(144, 143, 160, 0.05) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(144, 143, 160, 0.05) 1px, transparent 1px);
        }
        .glow-btn {
            box-shadow: inset 0 0 10px rgba(192, 193, 255, 0.2);
            transition: all 0.3s ease;
        }
        .glow-btn:hover {
            box-shadow: inset 0 0 20px rgba(192, 193, 255, 0.5), 0 0 15px rgba(99, 102, 241, 0.3);
        }
        .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(51, 65, 85, 0.5);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="bg-background text-on-background min-h-screen flex flex-col antialiased relative overflow-hidden">
<!-- Background Elements -->
<div class="absolute inset-0 grid-pattern pointer-events-none z-0"></div>
<div class="absolute top-1/4 left-1/4 w-[500px] h-[500px] bg-primary/5 rounded-full blur-[100px] pointer-events-none z-0"></div>
<div class="absolute bottom-1/4 right-1/4 w-[400px] h-[400px] bg-secondary/5 rounded-full blur-[80px] pointer-events-none z-0"></div>
<!-- Top Navigation (Transactional, no shell nav logic per prompt, just a brand anchor) -->
<header class="fixed top-0 w-full z-50 bg-surface/80 dark:bg-surface/80 backdrop-blur-xl border-b border-outline-variant/30 shadow-sm">
<div class="flex justify-between items-center w-full px-margin-mobile h-16 max-w-container-max mx-auto">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary text-2xl" style="font-variation-settings: 'FILL' 1;">shield_lock</span>
<span class="text-headline-sm font-headline-sm font-bold tracking-tighter text-primary dark:text-primary-fixed-dim">CIPHER_VAULT</span>
</div>
<div>
<span class="text-label-caps font-label-caps text-on-surface-variant flex items-center gap-1">
<span class="material-symbols-outlined text-sm">wifi</span> SECURE CONNECTION
                </span>
</div>
</div>
</header>
<!-- Main Content -->
<main class="flex-grow flex items-center justify-center z-10 px-4 pt-20 pb-10">
<div class="glass-panel rounded-xl w-full max-w-md p-8 shadow-2xl relative overflow-hidden">
<!-- Shimmer effect element -->
<div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-transparent via-primary to-transparent opacity-50 animate-pulse"></div>
<div class="text-center mb-8">
<h1 class="text-headline-lg font-headline-lg text-on-surface mb-2">Access Vault</h1>
<p class="text-body-md font-body-md text-on-surface-variant">Enter credentials to decrypt session.</p>
</div>
<form action="#" class="space-y-6" method="POST">
<!-- Email Input -->
<div class="space-y-2">
<label class="text-label-caps font-label-caps text-on-surface-variant block" for="email">IDENTIFIER (EMAIL)</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline">account_circle</span>
</div>
<input class="block w-full pl-10 pr-3 py-3 bg-surface-container-low border border-outline-variant rounded-lg text-body-md font-body-md text-on-surface focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-colors placeholder:text-outline-variant" id="email" name="email" placeholder="admin@ciphervault.local" required="" type="email"/>
</div>
</div>
<!-- Password Input -->
<div class="space-y-2">
<label class="text-label-caps font-label-caps text-on-surface-variant flex justify-between" for="password">
<span>PASSPHRASE</span>
<a class="text-primary hover:text-primary-fixed transition-colors" href="#">Forgot?</a>
</label>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline">key</span>
</div>
<input class="block w-full pl-10 pr-10 py-3 bg-surface-container-low border border-outline-variant rounded-lg text-body-md font-body-md text-on-surface focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-colors placeholder:text-outline-variant" id="password" name="password" placeholder="••••••••••••••••" required="" type="password"/>
<button class="absolute inset-y-0 right-0 pr-3 flex items-center text-outline hover:text-on-surface transition-colors focus:outline-none" type="button">
<span class="material-symbols-outlined">visibility</span>
</button>
</div>
</div>
<!-- Action Button -->
<div class="pt-4">
<button class="w-full flex justify-center items-center gap-2 py-4 px-6 bg-[#6366F1] hover:bg-[#4f46e5] text-white rounded-lg text-headline-sm font-headline-sm glow-btn active:scale-95 duration-100" type="submit">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">lock_open</span>
                        Secure Login
                    </button>
</div>
</form>
<div class="mt-8 pt-6 border-t border-outline-variant/30 text-center">
<p class="text-body-sm font-body-sm text-on-surface-variant">
                    New Operative? 
                    <a class="text-secondary hover:text-secondary-fixed transition-colors font-semibold ml-1" href="#">Request Access Provisioning</a>
</p>
</div>
</div>
</main>
<!-- Footer for subtle security info -->
<footer class="w-full py-4 text-center z-10 bg-surface/50 backdrop-blur-sm border-t border-outline-variant/10">
<p class="text-code-sm font-code-sm text-outline-variant">
            SYS.VER: 4.9.2 | ENCRYPTION: AES-256-GCM | TERMINAL: ACTIVE
        </p>
</footer>
</body></html>
